<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# Фильтр для RabbitMQ
<filter rabbitmq-service.**>
  @type record_transformer
  <record>
    service_name rabbitmq_container
    hostname ${hostname}
    timestamp ${time}
  </record>
  <parse>
    @type json
  </parse>
</filter>

# Фильтр для веб-сервиса
<filter web-service.**>
  @type record_transformer
  <record>
    service_name qms_service
    hostname ${hostname}
    timestamp ${time}
  </record>
  <parse>
    @type json
  </parse>
</filter>

# Запись логов RabbitMQ в отдельный файл
<match rabbitmq-service.**>
  @type file
  path /fluentd/log/rmq/rabbitmq
  append true
  add_path_suffix true
  path_suffix .json
  <format>
    @type pretty_json
  </format>
</match>

# Запись логов веб-сервиса в отдельный файл
<match web-service.**>
  @type file
  path /fluentd/log/web/web-service
  append true
  add_path_suffix true
  path_suffix .json
  <format>
    @type pretty_json
  </format>
  <inject>
    tag_key tag
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%z
  </inject>
  <record>
    level ${record["level"] || "info"}
  </record>
</match>

# Резервный матчер для всех логов
<match **>
  @type file
  path /fluentd/log/all/all
  append true
  <format>
    @type json
  </format>
</match>